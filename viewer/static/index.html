<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Part Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --edge: #2a2e37; --text: #e6e8ec;
    --dim: #9aa1ad; --accent: #ff7a45; --ok: #4cc38a; --bad: #ff6369;
  }
  * { box-sizing: border-box; margin: 0; }
  body { display: flex; height: 100vh; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  #side { width: 320px; min-width: 320px; background: var(--panel);
          border-right: 1px solid var(--edge); display: flex; flex-direction: column; }
  #side header { padding: 14px 16px; border-bottom: 1px solid var(--edge);
                 display: flex; align-items: center; justify-content: space-between; }
  #popout, #units { flex: 0 0 auto; width: 34px; height: 30px; padding: 0; font-size: 13px;
            background: var(--bg); border: 1px solid var(--edge); color: var(--dim); }
  #popout:hover, #units:hover { color: var(--text); border-color: var(--accent); }
  /* Floating mode: the panel becomes a draggable card over the viewport. */
  #side.float {
    position: fixed; z-index: 10; width: 340px; min-width: 0;
    max-height: calc(100vh - 24px); border: 1px solid var(--edge);
    border-radius: 12px; box-shadow: 0 14px 44px rgba(0,0,0,.55);
    background: rgba(28, 31, 38, .92); backdrop-filter: blur(10px);
  }
  #side.float #grab { cursor: grab; user-select: none; touch-action: none; }
  #side.float #grab:active { cursor: grabbing; }
  #side.float #log { height: 110px; }
  #side header h1 { font-size: 16px; }
  #side header .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #controls { padding: 14px 16px; overflow-y: auto; flex: 1; }
  #params { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
  .field { display: flex; flex-direction: column; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  textarea {
    width: 100%; padding: 7px 9px; background: var(--bg); color: var(--text);
    border: 1px solid var(--edge); border-radius: 6px; font: inherit; resize: vertical;
  }
  textarea:focus { outline: 1px solid var(--accent); }
  .warn { color: #ffb224; }
  #photorow { align-items: center; margin-top: 8px; }
  #photobtn, #importbtn { flex: 0 0 auto; padding: 6px 10px; font-weight: 500; }
  #photoname { flex: 1; color: var(--dim); font-size: 12px; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  #clearphoto { flex: 0 0 26px; padding: 4px 0; }
  select, input[type=number] {
    width: 100%; padding: 7px 9px; background: var(--bg); color: var(--text);
    border: 1px solid var(--edge); border-radius: 6px; font: inherit;
  }
  input[type=number]:focus, select:focus { outline: 1px solid var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; padding: 9px 0; border: 0; border-radius: 6px; font: inherit;
    font-weight: 600; cursor: pointer; background: var(--edge); color: var(--text);
  }
  button.primary { background: var(--accent); color: #16130f; }
  button:disabled { opacity: .38; cursor: default; }
  #stats { margin-top: 12px; color: var(--dim); font-size: 12px; min-height: 32px; }
  #stats b { color: var(--text); font-weight: 600; }
  #log { height: 150px; flex: none; overflow-y: auto; background: var(--bg);
         border-top: 1px solid var(--edge); padding: 10px 12px;
         font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         white-space: pre-wrap; word-break: break-word; }
  #log .ok { color: var(--ok); } #log .bad { color: var(--bad); }
  #log .dim { color: var(--dim); }
  footer { padding: 8px 16px; border-top: 1px solid var(--edge);
           color: var(--dim); font-size: 11px; }
  #view { flex: 1; position: relative; }
  #view canvas { display: block; }
  #badge { position: absolute; top: 12px; right: 14px; color: var(--dim);
           font-size: 12px; background: rgba(20,22,26,.7); padding: 4px 10px;
           border-radius: 6px; }
</style>
</head>
<body>
  <div id="side">
    <header id="grab">
      <div>
        <h1>Part Studio</h1>
        <div class="sub">Ender 3 V2 &middot; 220&times;220&times;250 &middot; PLA</div>
      </div>
      <div style="display:flex; gap:6px">
        <button id="units" title="Toggle inches / millimetres">in</button>
        <button id="popout" title="Pop the panel out so it can be dragged around">⇱</button>
      </div>
    </header>
    <div id="controls">
      <label for="desc">Describe it</label>
      <textarea id="desc" rows="3" placeholder="A new part (&quot;a headphone hook for a 18mm desk edge&quot;) or a change (&quot;make the hole 6mm&quot;)"></textarea>
      <div class="row" id="photorow">
        <button id="photobtn" title="Attach a reference photo">&#128247; photo</button>
        <input type="file" id="photo" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        <span id="photoname">no photo</span>
        <button id="clearphoto" hidden title="Remove photo">&times;</button>
        <button id="importbtn" title="Import an STL mesh (e.g. a photogrammetry scan)">&#8853; STL</button>
        <input type="file" id="importfile" accept=".stl" hidden>
      </div>
      <div class="row">
        <button id="buildnew" class="primary">Build new</button>
        <button id="editsel">Edit selected</button>
      </div>
      <label for="model">Model</label>
      <select id="model"></select>
      <div id="params"></div>
      <div class="row" style="align-items:flex-end">
        <div class="field" style="flex:0 0 90px">
          <label for="scale">scale &times;</label>
          <input type="text" id="scale" value="1" list="scales" spellcheck="false">
          <datalist id="scales">
            <option value="1/12"><option value="1/18"><option value="1/24">
            <option value="1/32"><option value="1/43"><option value="1/55">
            <option value="1/64"><option value="1/87"><option value="2">
          </datalist>
        </div>
        <button id="generate" class="primary">Generate</button>
      </div>
      <div class="row">
        <button id="slice" disabled>Slice + check</button>
        <button id="upload" disabled>Upload</button>
      </div>
      <div id="stats"></div>
    </div>
    <div id="log"></div>
    <footer>Uploads never select or start a print. Printing happens only via
    Claude, with explicit approval, after a first-layer check.</footer>
  </div>
  <div id="view"><div id="badge">drag to orbit &middot; scroll to zoom</div></div>
  <script type="importmap">
  { "imports": {
      "three": "/static/vendor/three.module.min.js",
      "three/addons/controls/OrbitControls.js": "/static/vendor/OrbitControls.js",
      "three/addons/loaders/STLLoader.js": "/static/vendor/STLLoader.js"
  } }
  </script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
